# Publishes site/ to GitHub Pages (https://fatcat.github.io/ephemeris/).
# No build step: the site is plain HTML and CSS. The favicon comes from the app.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, static/favicon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp static/favicon.svg site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
