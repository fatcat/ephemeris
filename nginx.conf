# This file is included inside the http{} block (as conf.d/default.conf),
# so http-context directives (js_*) belong at the top, before the servers.
# NOTE: `load_module` for njs lives in the main nginx.conf (set in the
# Dockerfile) because it is only valid in the main context.

# njs shared-memory zone: per-IP bad-request counters + ban entries.
# type=number is required for .incr(); entries carry their own TTL.
js_shared_dict_zone zone=scanban:1m timeout=24h type=number;
js_import ban from /etc/nginx/njs/ban.js;

# Redirect HTTP to HTTPS
server {
    listen 8080;
    server_name _;
    # $host is reflected here. Practical impact is low on a single-host,
    # self-signed deployment (HSTS is set, no shared cache), but to harden
    # against Host-header injection set `server_name your.host;` and add a
    # `default_server` that rejects unknown hosts. See README.
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hide nginx version
    server_tokens off;

    # Security headers — single source of truth (included here at server level
    # and again in any location that declares its own add_header, because nginx
    # drops inherited add_header once a location sets its own).
    include /etc/nginx/snippets/security-headers.conf;

    # Block banned IPs on EVERY path. The subrequest to /_bancheck runs the njs
    # ban-check; a 403 from it denies the request. Inherited by all locations
    # below (except /_bancheck itself, which turns it off to avoid recursion).
    auth_request /_bancheck;

    root /usr/share/nginx/html;
    index index.html;

    # Log to file for fail2ban (in addition to Docker stdout)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # njs ban-check target — internal only, never itself ban-checked.
    location = /_bancheck {
        internal;
        auth_request off;
        js_content ban.check;
    }

    # Known vulnerability-scanner paths: count the hit, return 444, and ban the
    # IP after the configured threshold (njs/ban.js + njs/ban-config.json).
    # Kept roughly in sync with fail2ban/filter.conf. No legitimate app route
    # collides with these (the SPA has no URL router).
    location ~* "^/(wp-[a-z]+|wordpress|wp-json/wp|phpmyadmin|pma|myadmin|mysql|adminer|dbadmin|administrator|manager|xmlrpc\.php|login\.php|cgi-bin|phpinfo|info\.php|status\.php|server-status|server-info|actuator|graphql|solr|telescope|console|vendor|node_modules|composer|storage/logs|laravel)" {
        js_content ban.scanner;
    }
    location ~* "^/\.(env|git|svn|htaccess|htpasswd|aws|docker|DS_Store)" {
        js_content ban.scanner;
    }

    # Serve the CA cert for easy download (inherits the full header set)
    location = /ca.crt {
        alias /certs/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache service worker with no-cache (must revalidate)
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
